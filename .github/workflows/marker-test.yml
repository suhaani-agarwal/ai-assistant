name: marker test
on:
  pull_request:
    branches: [test/marker-base]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the stale handler twice on the test PR, as the bot
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: 'false'
          STALE_DAYS: '7'
          CLOSE_DAYS: '14'
          WARNING_DAYS: '7'
          BACKLOG_DAYS: '30'
          NUDGE_DAYS: '7'
          FALLBACK_REVIEWERS: '@x/y'
          EXEMPT_LABELS: '["no-stale","hold"]'
          PR_MANAGEMENT_LIBRARY_ONLY: 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/w1" "$RUNNER_TEMP/w2"
          for i in 1 2; do
            echo "=== run $i"
            (cd "$RUNNER_TEMP/w$i" && bash -c "source $GITHUB_WORKSPACE/.github/actions/pr-management/stale.sh; handle_needs_author 4; echo handler-exit=\$?")
          done
          echo "=== bot marker comments on the PR (author, minimized):"
          gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){pullRequest(number:4){comments(last:100){nodes{author{login __typename} isMinimized minimizedReason body}}}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}" \
            --jq '.data.repository.pullRequest.comments.nodes[] | select(.author.__typename == "Bot" and (.body | test("pr-stale-author-action: observed"))) | "\(.author.login) minimized=\(.isMinimized) reason=\(.minimizedReason)"'
