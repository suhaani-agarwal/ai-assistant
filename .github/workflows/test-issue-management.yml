name: Test issue management

on:
  pull_request:
    paths:
      - .github/actions/issue-management/**
      - .github/workflows/issue-management.yml
      - .github/workflows/issue-management-validate.yml
      - .github/workflows/test-issue-management.yml
      - scripts/adopt-ci.sh
      - scripts/test-adopt-ci-pins.sh
      - adopt-ci-templates/**
  push:
    branches: [main]
    paths:
      - .github/actions/issue-management/**
      - .github/workflows/issue-management.yml
      - .github/workflows/issue-management-validate.yml
      - .github/workflows/test-issue-management.yml
      - scripts/adopt-ci.sh
      - scripts/test-adopt-ci-pins.sh
      - adopt-ci-templates/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/actions/issue-management/tests -v
      - name: Pin pattern of adopt-ci.sh
        run: scripts/test-adopt-ci-pins.sh
      - name: Validate shell syntax
        run: bash -n scripts/adopt-ci.sh
